# Windows release: build from the tagged source, optionally sign through SignPath, and attach
# the installers to a draft GitHub release. See CODE_SIGNING_POLICY.md and docs/windows.md.
#
#   build -> collect-binaries -> [sign-binaries] -> package -> collect-installers
#         -> [sign-installers] -> release
#
# Signing is two-stage because SignPath cannot sign files inside an NSIS installer: our own
# binaries are signed first, then the installer is built from them and signed. The bracketed
# jobs run only when the repository variable SIGNPATH_ORGANIZATION_ID is set (after SignPath
# Foundation approval). They use the `release-signing` environment, which must be configured
# with required reviewers, and SignPath requires its own manual approval for every request.
# Without SignPath the same pipeline produces unsigned installers.
#
# No signing keys are stored in GitHub: SignPath holds the certificate in its HSM. The only
# secret is SIGNPATH_API_TOKEN (submitter role), stored in the `release-signing` environment.
name: ProxyGridVPN / Windows release

on:
  push:
    tags:
      - 'proxygridvpn-v*'
  # Test the pipeline (unsigned, no release) when it changes.
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'client/electron/**'
      - 'third_party/tap-windows6/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (for example 1.0.0). Tag builds take it from the tag.'
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '0.0.1' }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PROXYGRID_COGNITO_REGION: ${{ vars.PROXYGRID_COGNITO_REGION }}
      PROXYGRID_USER_POOL_ID: ${{ vars.PROXYGRID_USER_POOL_ID }}
      PROXYGRID_USER_POOL_CLIENT_ID: ${{ vars.PROXYGRID_USER_POOL_CLIENT_ID }}
    strategy:
      fail-fast: true
      matrix:
        arch: [ia32, arm64]
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          use-cache: false
      # npm ci installs exactly the versions in package-lock.json (with integrity hashes). Caches
      # are not used in release builds.
      - run: npm ci
      - name: Set the version for the Windows version resources
        shell: pwsh
        run: |
          $v = $env:VERSION -replace '^proxygridvpn-v', ''
          if ($v -notmatch '^(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$') { throw "version '$v' is not semver" }
          $num = "$($Matches[1]),$($Matches[2]),$($Matches[3]),0"
          "PROXYGRIDVPN_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # .NET exposes AssemblyInformationalVersion as the PE ProductVersion.
          Add-Content client\electron\windows\OutlineService\OutlineService\Properties\AssemblyInfo.cs `
            "[assembly: AssemblyInformationalVersion(`"$v`")]"
          # Read by client/go/Taskfile.yml (tun2socks.exe, backend.dll); version.h is read by
          # smartdnsblock.rc.
          @(
            "#define PG_VERSION_NUM $num",
            "#define PG_VERSION_STR `"$v`""
          ) | Set-Content -Encoding ascii client\electron\windows\smartdnsblock\smartdnsblock\version.h
      - name: Build Windows helpers from source
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild client\electron\windows\OutlineService\OutlineService.sln /p:Configuration=Release /p:Platform=x86 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild client\electron\windows\smartdnsblock\smartdnsblock.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build tapctl from OpenVPN source (replaces devcon.exe)
        shell: pwsh
        run: pwsh client/electron/windows/tapctl/build_tapctl.ps1
      - name: Build app
        shell: bash
        run: |
          npm run action client/electron/build windows -- --arch ${{ matrix.arch }} \
            --buildMode=release --versionName="${VERSION#proxygridvpn-v}" \
            --autoUpdateUrl="${{ vars.PROXYGRIDVPN_UPDATE_URL || 'https://proxygrid.net/vpn/download/windows/' }}"
      - name: Verify packaged account configuration
        env:
          REQUIRE_ACCOUNT_CONFIG: ${{ github.repository == 'proxygridx/proxygridvpn-client' && (startsWith(github.ref, 'refs/tags/proxygridvpn-v') || github.event_name == 'workflow_dispatch') }}
        run: node client/electron/windows/test/verify_account_config.cjs output/client/electron/build/win-${{ matrix.arch }}-unpacked/resources/app.asar
      - name: Stage files for signing
        shell: bash
        run: |
          mkdir -p stage/${{ matrix.arch }}/helpers
          cp -r output/client/electron/build/win-${{ matrix.arch }}-unpacked stage/${{ matrix.arch }}/app
          cp client/electron/windows/OutlineService/OutlineService/bin/OutlineService.exe \
             client/electron/windows/smartdnsblock/bin/smartdnsblock.exe stage/${{ matrix.arch }}/helpers/
          for a in i386 amd64 arm64; do
            mkdir -p stage/${{ matrix.arch }}/tapctl/$a
            cp third_party/tap-windows6/bin/$a/tapctl.exe stage/${{ matrix.arch }}/tapctl/$a/
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-${{ matrix.arch }}
          path: stage
          if-no-files-found: error
          retention-days: 7

  # One artifact for both architectures, so each release needs one signing request per stage.
  collect-binaries:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: echo "value=${VERSION#proxygridvpn-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage-*
          merge-multiple: true
          path: binaries
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-unsigned
          path: binaries
          if-no-files-found: error
          retention-days: 7

  sign-binaries:
    needs: collect-binaries
    if: vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/proxygridvpn-v')
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          parameters: |
            version: "${{ needs.collect-binaries.outputs.version }}"
          github-artifact-id: ${{ needs.collect-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: binaries
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-signed
          path: binaries
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.arch }}
    needs: [collect-binaries, sign-binaries]
    if: always() && needs.collect-binaries.result == 'success' && (needs.sign-binaries.result == 'success' || needs.sign-binaries.result == 'skipped')
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        arch: [ia32, arm64]
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.sign-binaries.result == 'success' && 'binaries-signed' || 'binaries-unsigned' }}
          path: binaries
      # The installer takes the helpers from their build paths; put the (signed) copies there.
      - name: Place helpers
        shell: bash
        run: |
          cp binaries/${{ matrix.arch }}/helpers/OutlineService.exe client/electron/windows/OutlineService/OutlineService/bin/OutlineService.exe
          cp binaries/${{ matrix.arch }}/helpers/smartdnsblock.exe client/electron/windows/smartdnsblock/bin/smartdnsblock.exe
          for a in i386 amd64 arm64; do
            cp binaries/${{ matrix.arch }}/tapctl/$a/tapctl.exe third_party/tap-windows6/bin/$a/tapctl.exe
          done
      - name: Build installer from the staged app
        shell: bash
        run: |
          npm run action client/electron/build windows -- --arch ${{ matrix.arch }} \
            --buildMode=release --versionName="${VERSION#proxygridvpn-v}" \
            --autoUpdateUrl="${{ vars.PROXYGRIDVPN_UPDATE_URL || 'https://proxygrid.net/vpn/download/windows/' }}" \
            --prepackaged="binaries/${{ matrix.arch }}/app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.arch }}
          path: output/client/electron/build/*.exe
          if-no-files-found: error
          retention-days: 7

  # Exercise each installer and its network driver on a compatible Windows host.
  installer-smoke-test:
    name: Install, connect and uninstall (${{ matrix.arch }})
    needs: package
    if: always() && needs.package.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ia32
            os: windows-2022
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Local test Shadowsocks server (CI only, not shipped) for the VPN session test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: go build -o ss-test-server.exe ./client/go/outline/cmd/ss-test-server
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-${{ matrix.arch }}
          path: dist
      - name: Install, check, VPN session test, uninstall, check
        shell: pwsh
        run: |
          pwsh client/electron/windows/test/installer_smoke_test.ps1 `
            -Installer (Get-Item "dist\ProxyGridVPN-$($env:VERSION -replace '^proxygridvpn-v', '')-${{ matrix.arch }}.exe").FullName `
            -SessionServerExe (Resolve-Path ss-test-server.exe).Path `
            -ExpectedVersion ($env:VERSION -replace '^proxygridvpn-v', '') `
            -AccountSignIn:$${{ vars.PROXYGRID_USER_POOL_ID != '' }}

  collect-installers:
    needs: [package, installer-smoke-test]
    if: always() && needs.package.result == 'success' && needs.installer-smoke-test.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-unsigned
          path: installers
          if-no-files-found: error
          retention-days: 7

  sign-installers:
    needs: [collect-binaries, collect-installers]
    if: always() && needs.collect-installers.result == 'success' && vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/proxygridvpn-v')
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          parameters: |
            version: "${{ needs.collect-binaries.outputs.version }}"
          github-artifact-id: ${{ needs.collect-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: installers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-signed
          path: installers
          if-no-files-found: error
          retention-days: 7

  # Checksums, provenance attestation and a DRAFT release. A maintainer reviews and publishes it.
  release:
    needs: [collect-installers, sign-installers]
    if: always() && needs.collect-installers.result == 'success' && (needs.sign-installers.result == 'success' || needs.sign-installers.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.sign-installers.result == 'success' && 'installers-signed' || 'installers-unsigned' }}
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.exe | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: dist/*.exe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/proxygridvpn-v')
        with:
          path: source
          persist-credentials: false
      - name: Draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/proxygridvpn-v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.sign-installers.result == 'success' }}
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#proxygridvpn-v}"
          if [ "$SIGNED" = "true" ]; then
            echo 'Windows installers are code-signed.' > notes.md
          else
            echo '**Unsigned beta/test installers:** Windows SmartScreen may warn.' > notes.md
          fi
          echo >> notes.md
          cat "source/docs/releases/$version.md" >> notes.md
          printf '\n[Verify downloads](%s/docs/windows.md#verify-a-download) · [Code signing policy](%s/CODE_SIGNING_POLICY.md) · [Privacy policy](%s/PRIVACY.md)\n' "$base" "$base" "$base" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
            --title "ProxyGridVPN ${GITHUB_REF_NAME#proxygridvpn-v}" \
            --notes-file notes.md
